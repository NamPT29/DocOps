<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Số hóa All in One</title>
    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="windows-ui.css?v=10">
</head>
<body class="login-shell">
    <div class="card p-4 login-card bg-white">
        <h1 class="h4 text-center mb-4 text-primary"><i class="fas fa-shield-alt" aria-hidden="true"></i> Số hóa All in One</h1>
        <div class="mb-3">
            <label class="form-label text-muted fw-bold" for="loginUsername">Tên đăng nhập</label>
            <input type="text" id="loginUsername" name="username" class="form-control form-control-lg" placeholder="Nhập tài khoản" autocomplete="username" required>
        </div>
        <div class="mb-4">
            <label class="form-label text-muted fw-bold" for="loginPassword">Mật khẩu</label>
            <input type="password" id="loginPassword" name="password" class="form-control form-control-lg" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
        </div>
        <button type="button" id="loginButton" class="btn btn-primary btn-lg w-100">Đăng nhập</button>
        <p id="loginError" class="text-danger mt-3 text-center" role="alert" aria-live="polite" hidden></p>
    </div>

    <script src="login.js?v=2"></script>
</body>
</html>
