# Configuration used by SonarQube Cloud Automatic Analysis.
# Keep this separate from sonar-project.properties, which applies only to a
# scanner run from CI or a developer machine.

# Analyse deployable application code as source code.  The test directory is
# declared separately so production-only rules are not applied to the Node VM
# self-check harnesses.
sonar.sources=server,frontend,app_launcher.py,host_console.py,run_server.py,wizard.py
sonar.tests=tests

sonar.sourceEncoding=UTF-8
sonar.python.version=3.11
