sonar.projectKey=hoagg-2603_Scan_to_text
sonar.organization=hoagg-2603

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=Scan_to_text
sonar.projectVersion=1.0

# CI/manual scanner scope. Automatic Analysis reads .sonarcloud.properties.
sonar.sources=server,frontend,app_launcher.py,host_console.py,run_server.py,wizard.py
sonar.tests=tests

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Exclude patterns
sonar.exclusions=**/*.spec.js,**/node_modules/**,**/dist/**,**/build/**,**/__pycache__/**,**/venv/**,.git/**,docker-data/**,logs/**,uploads/**

# Python specific
sonar.python.version=3.11

# JavaScript specific
sonar.javascript.file.suffixes=.js,.jsx

# Coverage
sonar.coverage.exclusions=**/tests/**,**/*.test.js,**/node_modules/**
