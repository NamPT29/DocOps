// Đọc dữ liệu
const CATS = [], CARDS = [];
RAW.trim().split('\n').forEach(line => {
  line = line.trim();
  if (!line) return;
  if (line.startsWith('##')) { CATS.push(line.slice(2).trim().split('|')); return; }
  const [en, ipa, vi] = line.split('|');
  CARDS.push({ id: (CATS.length - 1) + ':' + en, en, ipa: '/' + ipa + '/', vi, cat: CATS.length - 1 });
});

// Từ đã thuộc (lưu trong trình duyệt)
let known = {};
try { known = JSON.parse(localStorage.getItem('flashcard-known')) || {}; } catch (e) {}
const saveKnown = () => { try { localStorage.setItem('flashcard-known', JSON.stringify(known)); } catch (e) {} };

let cat = -1, enFirst = true, deck = [], i = 0, flipped = false;
const $ = id => document.getElementById(id);

$('cat').innerHTML = '<option value="-1">Tất cả chủ đề (' + CARDS.length + ')</option>' +
  CATS.map((c, k) => '<option value="' + k + '">' + (k + 1) + '. ' + c[0] + ' – ' + c[1] +
  ' (' + CARDS.filter(x => x.cat === k).length + ')</option>').join('');

function buildDeck() {
  deck = CARDS.filter(c => (cat < 0 || c.cat === cat) && !known[c.id]);
  i = 0; flipped = false; show();
}

function show() {
  const all = CARDS.filter(c => cat < 0 || c.cat === cat);
  const nKnown = all.filter(c => known[c.id]).length;
  $('info').textContent = 'Đã thuộc ' + nKnown + '/' + all.length + ' · Còn ' + deck.length + ' thẻ chưa thuộc';

  if (!deck.length) {
    $('card').innerHTML = '<div class="done">🎉 Đã thuộc hết chủ đề này!</div><div class="hint">Bấm "Học lại từ đầu" để ôn lại</div>';
    return;
  }
  if (i >= deck.length) i = 0;
  if (i < 0) i = deck.length - 1;
  const c = deck[i];
  const front = enFirst
    ? '<div class="main">' + c.en + '</div><div class="ipa">' + c.ipa + '</div>'
    : '<div class="main">' + c.vi + '</div>';
  const back = enFirst
    ? '<div class="meaning">' + c.vi + '</div>'
    : '<div class="meaning">' + c.en + '</div><div class="ipa">' + c.ipa + '</div>';
  $('card').innerHTML =
    '<div class="cat">' + CATS[c.cat][1] + '</div>' +
    '<div class="count">' + (i + 1) + ' / ' + deck.length + '</div>' +
    front + (flipped ? back : '') +
    '<div class="hint">' + (flipped ? '' : 'Bấm vào thẻ hoặc Space để xem đáp án') + '</div>';
}

function speak() {
  const c = deck[i]; if (!c) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(c.en);
    u.lang = 'en-GB'; u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function flip() {
  flipped = !flipped; show();
  if (flipped && !enFirst) speak();
}
function go(step) { i += step; flipped = false; show(); if (enFirst) speak(); }

function markKnown() {
  const c = deck[i]; if (!c) return;
  known[c.id] = true; saveKnown();
  deck.splice(i, 1); flipped = false; show(); if (enFirst) speak();
}
function markDont() {
  const c = deck[i]; if (!c) return;
  // Đưa thẻ chưa thuộc về sau 3 thẻ để gặp lại sớm
  deck.splice(i, 1);
  deck.splice(Math.min(i + 3, deck.length), 0, c);
  flipped = false; show(); if (enFirst) speak();
}

$('card').onclick = flip;
$('next').onclick = () => go(1);
$('prev').onclick = () => go(-1);
$('know').onclick = markKnown;
$('dont').onclick = markDont;
$('speak').onclick = speak;
$('cat').onchange = e => { cat = +e.target.value; buildDeck(); };
$('dir').onclick = () => { enFirst = !enFirst; $('dir').textContent = enFirst ? 'Anh → Việt' : 'Việt → Anh'; flipped = false; show(); };
$('shuffle').onclick = () => {
  for (let k = deck.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [deck[k], deck[j]] = [deck[j], deck[k]]; }
  i = 0; flipped = false; show();
};
$('reset').onclick = () => {
  CARDS.forEach(c => { if (cat < 0 || c.cat === cat) delete known[c.id]; });
  saveKnown(); buildDeck();
};

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === ' ') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === '1') markDont();
  else if (e.key === '2') markKnown();
  else if (e.key.toLowerCase() === 's') speak();
});

buildDeck();
</script>
